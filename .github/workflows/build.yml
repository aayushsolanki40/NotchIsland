name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build universal app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Build
        # Tag builds stamp the tag (minus the leading "v") as the app version.
        run: ./build.sh "${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}"

      - name: Verify bundle
        run: |
          lipo -info build/NotchIsland.app/Contents/MacOS/NotchIsland
          codesign --verify --verbose build/NotchIsland.app
          plutil -p build/NotchIsland.app/Contents/Info.plist | grep -E "CFBundle(Identifier|ShortVersionString)"

      - name: Package
        run: ditto -c -k --keepParent build/NotchIsland.app NotchIsland.zip

      - uses: actions/upload-artifact@v7
        with:
          name: NotchIsland
          path: NotchIsland.zip
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: NotchIsland

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" NotchIsland.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "NotchIsland $GITHUB_REF_NAME" \
            --generate-notes
