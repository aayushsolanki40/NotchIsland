name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug!
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you see, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Play a song in Spotify
        2. Hover the notch
        3. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: NotchIsland version
      placeholder: 1.0.0 (or commit hash if built from source)
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: macOS 15.1
    validations:
      required: true
  - type: dropdown
    id: display
    attributes:
      label: Display
      options:
        - MacBook with a notch
        - MacBook without a notch
        - External display
    validations:
      required: true
  - type: dropdown
    id: style
    attributes:
      label: Island style
      options:
        - Notch (attached)
        - iPhone Pill (floating)
  - type: textarea
    id: logs
    attributes:
      label: Screenshots, recordings or logs
      description: "Logs: `log stream --predicate 'process == \"NotchIsland\"'`"
